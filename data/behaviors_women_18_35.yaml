# Behavioral distributions for US women aged 18-35 — for Method D grounding.
#
# SOURCE: Pew Research Center, American Trends Panel Wave 173 ("How Americans
# View AI and Its Impact on People and Society"), fielded June 9-15, 2025,
# N=5,023 US adults. Files in data/:
#   - PS_2025.9.15_AI-and-its-impact_report.pdf   (charts + Appendix crosstabs)
#   - PS_2025.9.17_AI-and-its-impact_topline.pdf  (full response percentages)
#
# APPROXIMATION — read before using these numbers:
# Pew W173 publishes these five measures broken out by GENDER and by AGE BAND
# separately, but NOT as a women x age crosstab. There is therefore no published
# "women 18-35" distribution. For each measure below:
#   * `source_pew` records the actual published marginals (us_adults, women,
#     ages_18_29, ages_30_49) so nothing is hidden.
#   * `women_18_35` is an ESTIMATE derived as:
#       1. age blend = (2/3 * ages_18_29) + (1/3 * ages_30_49)
#          — weights approximate the 18-35 span (18-29 is ~12 yrs, 30-35 ~6 yrs).
#       2. shift by the gender gap = (women - us_adults), applied per category.
#       3. renormalize to sum to 100, round to integers.
#     This carries the strong young-adult signal (younger adults are far more
#     AI-aware, higher-usage, more comfortable) and nudges it toward the female
#     direction Pew reports (women slightly less aware, more concerned, less
#     willing). It is an approximation, not a measured subgroup.
#
# USAGE-FREQUENCY NOTE: the topline reports five usage levels for US adults, but
# the Appendix crosstabs collapse "almost constantly" + "several times a day"
# into one bar. The women_18_35 estimate is computed on the collapsed 4-category
# form, then the top bar is split into "almost_constantly" vs "several_times_a_day"
# using the US-adult ratio 5:26 (topline). source_pew.women / ages_* below are
# shown in the collapsed 4-category form Pew actually published.
#
# Percentages may not sum to exactly 100 in source rows (rounding; "no answer"
# omitted). women_18_35 rows are renormalized to 100.

ai_awareness:
  question: "How much have you heard or read about AI?"
  categories: [heard_a_lot, heard_a_little, nothing_at_all]
  pew_source:
    us_adults: "topline p.2, item AI_HEARD, row 'Jun 9-15, 2025' (47/48/5)"
    women_and_age_bands: "report p.12 chart 'Younger adults are more likely than older adults to say they have heard a lot about AI' (women 41/52/6; 18-29 62/35/3; 30-49 51/45/3)"
  women_18_35:
    heard_a_lot: 53
    heard_a_little: 43
    nothing_at_all: 4
  source_pew:
    us_adults:   {heard_a_lot: 47, heard_a_little: 48, nothing_at_all: 5}
    women:       {heard_a_lot: 41, heard_a_little: 52, nothing_at_all: 6}
    ages_18_29:  {heard_a_lot: 62, heard_a_little: 35, nothing_at_all: 3}
    ages_30_49:  {heard_a_lot: 51, heard_a_little: 45, nothing_at_all: 3}

ai_usage_frequency:
  question: "Just your impression, how often do you interact with AI?"
  categories: [almost_constantly, several_times_a_day, about_once_a_day, several_times_a_week, less_often]
  pew_source:
    us_adults: "topline p.2, item USEAI, row 'Jun 9-15, 2025' (5/26/15/17/38, full 5-category)"
    women_and_age_bands: "report p.14 chart 'A majority of Americans say they interact with AI at least several times a week' (collapsed: women 28/14/16/42; 18-29 33/20/21/26; 30-49 37/16/14/33)"
  women_18_35:
    almost_constantly: 5
    several_times_a_day: 27
    about_once_a_day: 18
    several_times_a_week: 18
    less_often: 32
  source_pew:
    # us_adults shown in full 5-category form (topline). women/ages_* shown in
    # the collapsed 4-category form Pew published (top two levels combined).
    us_adults:
      almost_constantly: 5
      several_times_a_day: 26
      about_once_a_day: 15
      several_times_a_week: 17
      less_often: 38
    women:      {almost_constantly_or_several_a_day: 28, about_once_a_day: 14, several_times_a_week: 16, less_often: 42}
    ages_18_29: {almost_constantly_or_several_a_day: 33, about_once_a_day: 20, several_times_a_week: 21, less_often: 26}
    ages_30_49: {almost_constantly_or_several_a_day: 37, about_once_a_day: 16, several_times_a_week: 14, less_often: 33}

ai_sentiment:
  question: "Does the increased use of AI in daily life make you feel...?"
  categories: [more_concerned, more_excited, equally]
  pew_source:
    us_adults: "topline p.2, item CNCEXC, row 'Jun 9-15, 2025' (more excited 10 / more concerned 50 / equally 38)"
    women_and_age_bands: "report p.42 Appendix chart 'Concern over the increased use of AI in daily life is widespread...' (women 55/8/36; 18-29 47/14/39; 30-49 48/15/37)"
  women_18_35:
    more_concerned: 52
    more_excited: 12
    equally: 36
  source_pew:
    us_adults:   {more_concerned: 50, more_excited: 10, equally: 38}
    women:       {more_concerned: 55, more_excited: 8,  equally: 36}
    ages_18_29:  {more_concerned: 47, more_excited: 14, equally: 39}
    ages_30_49:  {more_concerned: 48, more_excited: 15, equally: 37}

willingness_ai_assist:
  question: "How much would you be willing to let AI assist with your day-to-day tasks?"
  categories: [a_lot, a_little, not_at_all]
  pew_source:
    us_adults: "topline p.5, item AIASSIST, row 'Jun 9-15, 2025' (13/60/27)"
    women_and_age_bands: "report p.39 Appendix chart 'Majority of Americans are willing to let AI assist with day-to-day activities at least a little' (women 10/58/31; 18-29 17/60/23; 30-49 16/60/24)"
  women_18_35:
    a_lot: 14
    a_little: 58
    not_at_all: 28
  source_pew:
    us_adults:   {a_lot: 13, a_little: 60, not_at_all: 27}
    women:       {a_lot: 10, a_little: 58, not_at_all: 31}
    ages_18_29:  {a_lot: 17, a_little: 60, not_at_all: 23}
    ages_30_49:  {a_lot: 16, a_little: 60, not_at_all: 24}

control_attitudes:
  question: "Which better describes how you feel about the amount of control you have over how AI is used in your life?"
  categories: [want_more_control, comfortable, not_sure]
  pew_source:
    us_adults: "topline p.4, item AICONTROL2, row 'Jun 9-15, 2025' (comfortable 17 / more control 61 / not sure 21)"
    women_and_age_bands: "report p.41 Appendix chart '6 in 10 Americans say they would like more control over the use of AI in their lives' (women 60/15/24; 18-29 59/29/12; 30-49 60/20/20)"
  women_18_35:
    want_more_control: 58
    comfortable: 24
    not_sure: 18
  source_pew:
    us_adults:   {want_more_control: 61, comfortable: 17, not_sure: 21}
    women:       {want_more_control: 60, comfortable: 15, not_sure: 24}
    ages_18_29:  {want_more_control: 59, comfortable: 29, not_sure: 12}
    ages_30_49:  {want_more_control: 60, comfortable: 20, not_sure: 20}
